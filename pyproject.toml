[project]
name = "oman-data"
version = "0.1.0"
description = "The unofficial developer layer for Oman's open data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=15",
  "PyYAML>=6",
  "requests>=2.31",
  "jsonschema>=4.21",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oman_data*"]
