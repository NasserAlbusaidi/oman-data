name: refresh-monthly
# Datasets with cadence: monthly. The static ones (admin_geography,
# climate_normals) are deliberately on no schedule at all — a 1991-2020 climate
# normal and a wilayat list have no upstream to poll, so a cron would only churn
# fetched_at. tests/test_repo_guards.py pins that split, so adding a pipeline
# without wiring it in here fails the suite.
on:
  schedule:
    - cron: "0 3 5 * *"   # 05th monthly, 03:00 UTC (07:00 Muscat)
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      # Each dataset gets its own step: one dead upstream must not skip the
      # others, nor the commit of whatever did succeed.
      - name: Refresh cpi
        id: cpi
        continue-on-error: true
        run: python -m oman_data.run cpi
      - name: Refresh fuel_prices
        id: fuel_prices
        continue-on-error: true
        run: python -m oman_data.run fuel_prices
      - name: Refresh trade
        id: trade
        continue-on-error: true
        run: python -m oman_data.run trade
      - name: Refresh tourism
        id: tourism
        continue-on-error: true
        run: python -m oman_data.run tourism
      - name: Commit refreshed data
        env:
          FUEL_OUTCOME: ${{ steps.fuel_prices.outcome }}
        run: |
          git config user.name "oman-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw data api
          # prices.csv is the one file under pipelines/ that a run may rewrite:
          # fuel_prices curates the months NSS drops on rollover, so a month not
          # committed here is lost for good (parse.py::persist). Staged by exact
          # path and only when that dataset succeeded — a blanket `git add
          # pipelines` would commit whatever a half-failed run left behind.
          if [ "$FUEL_OUTCOME" = "success" ]; then
            git add pipelines/fuel_prices/prices.csv
          fi
          git diff --cached --quiet || git commit -m "data: monthly refresh $(date -u +%Y-%m)"
          git push
      - name: Fail if any dataset failed
        env:
          OUTCOMES: >-
            cpi=${{ steps.cpi.outcome }}
            fuel_prices=${{ steps.fuel_prices.outcome }}
            trade=${{ steps.trade.outcome }}
            tourism=${{ steps.tourism.outcome }}
        run: |
          echo "$OUTCOMES"
          echo "$OUTCOMES" | grep -q failure && exit 1 || exit 0
      # One open issue per outage, not one per run. A source that stays
      # unreachable for months would otherwise file an identical issue every
      # month until nobody reads any of them.
      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_PREFIX: "Monthly refresh failed"
          OUTCOMES: >-
            cpi=${{ steps.cpi.outcome }}
            fuel_prices=${{ steps.fuel_prices.outcome }}
            trade=${{ steps.trade.outcome }}
            tourism=${{ steps.tourism.outcome }}
        run: |
          body="Outcomes: $OUTCOMES — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — successes were committed; failed datasets keep last-good data."
          open=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title | startswith(\"$TITLE_PREFIX\"))][0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE_PREFIX $(date -u +%Y-%m-%d)" --body "$body"
          fi
