id: gdp
title_ar: "الناتج المحلي الإجمالي بأسعار السوق — سنوي، بالأسعار الجارية والثابتة (سنة الأساس ٢٠١٨)"
title_en: "GDP at market prices — annual, current and constant 2018 prices"
source_name: "NCSI via data.gov.om (National Accounts, dataset zoangf)"
source_url: "https://data.gov.om/zoangf"
license: "Open Government License - Sultanate of Oman"
cadence: annual
columns:
  - {name: year, dtype: int, min: 2000, max: 2035}
  - {name: price_basis, dtype: str}
  - {name: gdp_mn_omr, dtype: float, min: 1000, max: 200000}
notes: >
  Annual gross domestic product at market prices for the Sultanate of Oman in
  millions of Omani Riyals, from NCSI's National Accounts dataset on
  data.gov.om. One row per year and price basis: price_basis "current" is GDP
  valued at each year's own prices (the nominal figure), price_basis "constant"
  is the same aggregate valued at the prices of the base year, which strips out
  price change and leaves the volume movement. The base year is 2018 — the
  source's own dataset description says the Sultanate's SNA 2008 accounts
  "adopted 2018 as a new base year for (SNA) in Oman instead of 2010", and the
  data agrees: 2018 is the one year where the two bases are identical to the
  last decimal (35,184.0 million OMR either way). NCSI's earlier base-2010
  national accounts are a separate database on the portal (OMNTAC2016) and are
  not mixed in here, so these figures are not comparable with that one.
  Both series start in 2010. Current prices run to 2024 (41,194.3 million OMR)
  but constant prices only to 2023, because NCSI has not yet published the
  constant-price estimate for 2024 — so 2024 has a single row rather than two.
  That raggedness is the reason for the long layout: the newest year is the
  headline number, and a wide year-per-row table would have had to drop it or
  fill it with a null. Values are millions of Omani Riyals exactly as published
  (declared unit "Mn.R.O", scale 1) — no scale factor is applied, and a change
  of either declaration raises rather than silently shifting every number.
  Cadence is annual on purpose: the source's own metadata for this indicator
  labels its frequency "quarterly", but the portal returns no quarterly and no
  monthly observations for it at the national total, so annual is what is
  actually published. National totals only — the source's economic-activity and
  institutional-sector dimensions (53 and 8 members respectively, "Total"
  included in each) are pinned to those "Total" members, so no GDP breakdown by
  activity or by sector is published here, and the other 38 indicators in the
  same cube (GDP at basic and producers' prices, expenditure-side GDP, gross
  national income and disposable income, gross fixed capital formation,
  domestic and national saving, the GDP deflator, GDP per capita) are out of
  scope for v2. Same caveat as the tourism dataset regarding the portal's
  public client_id. NCSI revises recent years as the source returns are
  finalised, so the newest year should be read as provisional.
